<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeTasks | Custom Edition</title>
    <style>
        :root {
            --primary: #FF7E67; 
            --primary-hover: #FF6347;
            --bg-color: #F7F9FC;
            --surface: #FFFFFF;
            --text-main: #2D3748;
            --text-muted: #718096;
            --border: #E2E8F0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-banner {
            background: linear-gradient(135deg, #2D3748, #1A202C);
            color: white;
            width: 100%;
            text-align: center;
            padding: 3rem 1rem;
            margin-bottom: -3rem;
            box-sizing: border-box;
        }

        .header-banner h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }

        .header-banner p {
            color: #A0AEC0;
            margin: 0;
        }

        .app-container {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 2.5rem;
            box-sizing: border-box;
            z-index: 10;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .filters button {
            background-color: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
        }

        .filters button:hover, .filters button:focus {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: var(--bg-color);
            border-radius: 8px;
            margin-bottom: 0.8rem;
            border: 1px solid var(--border);
        }

        .task-text {
            font-size: 1.05rem;
            font-weight: 500;
        }

        .done .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-actions button {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            margin-left: 5px;
            border-radius: 6px;
        }

        .btn-complete { background-color: #48BB78; }
        .btn-complete:hover { background-color: #38A169; }
        
        .btn-delete { background-color: #F56565; }
        .btn-delete:hover { background-color: #E53E3E; }
    </style>
</head>
<body>
    <div class="header-banner">
        <h1>TypeTasks</h1>
        <p>A type-safe task tracker — Custom Edition</p>
    </div>
    
    <div class="app-container">
        <div class="controls">
            <input type="text" id="task-input" placeholder="What needs to be done?">
            <button id="add-btn">Add Task</button>
        </div>

        <div class="filters">
            <button id="filter-all">All</button>
            <button id="filter-todo">To Do</button>
            <button id="filter-done">Done</button>
        </div>

        <ul id="task-list"></ul>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
